services:
  - type: web
    name: shomer-hakkahila
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /app/data
      - key: OAUTH_PORT
        value: 3000
      - key: ENABLE_MEMBERS_INTENT
        value: "true"
      - key: AUTO_DEPLOY_COMMANDS
        value: "true"
