name: Keep Render bot awake

on:
  schedule:
    # GitHub's minimum is 5 minutes. Render sleeps after ~15 minutes idle.
    # Off-grid minutes avoid the crowded :00/:05/:10... schedule queue.
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          echo "Pinging $(date -u +%FT%TZ)"
          curl -fsS --retry 2 --retry-delay 3 --max-time 90 https://bots-xinz.onrender.com/health
          echo
