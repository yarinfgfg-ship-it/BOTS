name: Keep Render bot awake

# Free GitHub Actions cron (public repo) pings Render often enough that the
# free web service never goes to sleep. No secrets are used.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping bot health endpoint
        run: |
          code=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' 'https://bots-xinz.onrender.com/health' || true)
          echo "Render health status: $code"
          code2=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' 'https://bots-xinz.onrender.com/version' || true)
          echo "Render version status: $code2"
