name: Keep Render bot awake (long runner backup)

# Second self-dispatching chain, offset from the primary. If one chain stops,
# the other keeps pinging. Cron is only a fallback for a fully stopped chain.
on:
  schedule:
    - cron: '3 */6 * * *'
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: render-keep-alive-long-backup
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Ping Render every 4 minutes and dispatch the next run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 85); do
            echo "$(date -u +%FT%TZ) ping $i"
            curl -fsS --max-time 60 'https://bots-xinz.onrender.com/health' || true
            echo
            sleep 240
          done
          echo "$(date -u +%FT%TZ) dispatching next run"
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${{ github.repository }}/actions/workflows/keep-alive-long-backup.yml/dispatches" \
            -f ref=main
