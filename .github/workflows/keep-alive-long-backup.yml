name: Keep Render bot awake (long runner backup)

# Overlapping long runner, offset by 3 hours from the primary job.
on:
  schedule:
    - cron: '3 */6 * * *'
  workflow_dispatch:

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Ping Render every 4 minutes
        run: |
          for i in $(seq 1 85); do
            echo "$(date -u +%FT%TZ) ping $i"
            curl -fsS --max-time 60 'https://bots-xinz.onrender.com/health' || true
            echo
            sleep 240
          done
